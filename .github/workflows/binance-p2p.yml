name: Binance P2P push

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Cần quyền ghi để tự commit 1 lần / 30 ngày (giữ lịch chạy không bị GitHub tắt sau 60 ngày không hoạt động)
permissions:
  contents: write

# Không hủy lần đang chạy; lần mới đợi lần cũ xong để giá được gửi liên tục (mỗi lần chạy gửi giá mỗi 60 giây trong 4 phút)
concurrency:
  group: binance-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node binance_push.js
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ALERT_KEY: ${{ secrets.ALERT_KEY }}
          RUN_SEC: '240'
      - name: Giữ lịch chạy (commit nếu đã quá 30 ngày)
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt 2592000 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keepalive.txt
            git commit -m "keepalive"
            git push
          fi
