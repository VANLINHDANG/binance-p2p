name: Binance P2P push

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: binance-push
  cancel-in-progress: true

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node binance_push.js
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ALERT_KEY: ${{ secrets.ALERT_KEY }}
